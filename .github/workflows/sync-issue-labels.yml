name: Sync issue labels

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    if: github.event.pull_request.bname: Sync issue labels

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'dev'

    steps:
      - name: Copy labels from associated issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repo = os.environ["REPO"]
          owner, name = repo.split("/")
          number = int(os.environ["PR_NUMBER"])

          def gh(*args):
              result = subprocess.check_output(
                  ["gh", "api", *args], text=True
              )
              return json.loads(result)

          pr = gh(f"repos/{repo}/pulls/{number}")

          # Obtain issues GitHub associates with the PR.
          query = """
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 100) {
                  nodes { number }
                }
              }
            }
          }
          """

          result = gh(
              "graphql",
              "-f", f"query={query}",
              "-f", f"owner={owner}",
              "-f", f"name={name}",
              "-F", f"number={number}",
          )

          linked = result["data"]["repository"]["pullRequest"]
          issue_numbers = {
              item["number"]
              for item in linked["closingIssuesReferences"]["nodes"]
          }

          # Support explicit references in the PR description.
          body = pr.get("body") or ""
          issue_numbers.update(
              int(value)
              for value in re.findall(
                  r"\b(?:refs?|closes?|fixes?|resolves?)\s+#(\d+)\b",
                  body,
                  re.IGNORECASE,
              )
          )

          # Support issue-number-prefixed branch names.
          branch = pr["head"]["ref"]
          match = re.match(r"^(\d+)[-_]", branch)

          if match:
              issue_numbers.add(int(match.group(1)))

          if not issue_numbers:
              print("No associated issue found.")
              raise SystemExit(0)

          existing = {
              label["name"]
              for label in pr["labels"]
          }

          copied = set()

          for issue_number in sorted(issue_numbers):
              try:
                  issue = gh(
                      f"repos/{repo}/issues/{issue_number}"
                  )
              except subprocess.CalledProcessError:
                  print(f"Skipping unavailable issue #{issue_number}")
                  continue

              # Do not treat another PR as an issue.
              if "pull_request" in issue:
                  continue

              for label in issue["labels"]:
                  label_name = label["name"]

                  # Do not overwrite existing SemVer classification.
                  if (
                      label_name.startswith("semver:")
                      and any(
                          value.startswith("semver:")
                          for value in existing | copied
                      )
                  ):
                      continue

                  if label_name not in existing:
                      copied.add(label_name)

          if copied:
              payload = json.dumps(
                  {"labels": sorted(copied)}
              )

              subprocess.run(
                  [
                      "gh", "api", "--method", "POST",
                      f"repos/{repo}/issues/{number}/labels",
                      "--input", "-",
                  ],
                  input=payload,
                  text=True,
                  check=True,
              )

              print(f"Copied labels: {sorted(copied)}")
          else:
              print("No new labels to copy.")
          PYase.ref == 'dev'

