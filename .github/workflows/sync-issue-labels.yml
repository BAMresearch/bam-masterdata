name: Sync issue labels

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  sync-labels:
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      # Never check out untrusted PR code with pull_request_target.
      - name: Check out trusted workflow scripts
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Copy labels from associated issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/sync_issue_labels.py
