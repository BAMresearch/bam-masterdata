name: Documentation
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - run: |
          pip install -e .
          pip install "zensical==0.0.53" mkdocstrings-python
      - run: zensical build --clean
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Export datamodel schemas
        run: python .github/scripts/export_schemas.py
      - name: Build Schema Explorer
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Include Schema Explorer in documentation
        run: |
          mkdir -p site/schema-explorer
          cp -R frontend/dist/. site/schema-explorer/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
