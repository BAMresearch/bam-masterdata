name: Validate PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
    branches:
      - dev
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync-labels:
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      contains(
        fromJSON('["opened", "reopened", "edited"]'),
        github.event.action
      )
    permissions:
      contents: read
      issues: read
      pull-requests: write
    uses: ./.github/workflows/sync-issue-labels.yml

  validate:
    name: Validate PR metadata
    needs: sync-labels
    if: >-
      always() &&
      (
        needs.sync-labels.result == 'success' ||
        needs.sync-labels.result == 'skipped'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted scripts
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Validate PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/validate_pr.py
