name: Build and publish Python package

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Verify that the release tag points to a commit in main
      - name: Verify release originates from main
        shell: bash
        run: |
          git fetch origin main

          TAG_COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}")

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag is not part of main."
            echo "PyPI publication cancelled."
            exit 1
          fi

          echo "Release tag is part of main."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distribution
        run: |
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI

    needs:
      - build

    runs-on: ubuntu-latest

    environment:
      name: pypi
      # Replace with your actual PyPI project URL
      # url: https://pypi.org/p/YOUR_PACKAGE_NAME

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
