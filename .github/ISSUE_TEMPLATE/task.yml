name: General task
description: Maintenance, documentation, CI, or other project work
title: ""
labels: ["type:maintenance"]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be done?
      description: Describe the task and its motivation.
      placeholder: Describe the proposed work.
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: When is this complete?
      description: Optional acceptance criteria or expected outcome.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Labels:** If you have permission, add the relevant
        `area:*` and `priority:*` labels after creating the issue.
        Maintainers may adjust the type label as needed.
